    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        architecture: ${{ matrix.python_arch }}
    - name: install dependencies
      run: |
        python -mpip install --progress-bar=off -r ci/requirements.txt
        virtualenv --version
        pip --version
        tox --version
        pip list --format=freeze
    - name: test
      run: >
        tox -e ${{ matrix.tox_env }} -v
    - uses: codecov/codecov-action@v5
      if: matrix.cover
      env:
        # codecov-action@v5 transitively pulls in actions/github-script which still
        # targets Node 20 internally. This silences the warning until codecov releases a fix.
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      with:
        flags: ${{ matrix.name }}
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true

  integration-plip-testsuite:
    name: "integration (${{ matrix.pdb }} - ${{ matrix.label }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # One matrix entry per structure from PLIP's own test suite
        # (https://github.com/pharmai/plip/tree/master/plip/test/pdb), curated so that every
        # PLIP interaction type and every primary/partner molecule combination (small-molecule
        # partner, DNA partner, RNA-only primary chain, peptide partner, NMR ensemble) is
        # exercised at least once. primary_chain/partner_chain are csv2cxc's two chain groups
        # for this single-source run (see docs/usage.rst); they say nothing about which side
        # PLIP itself called "receptor" vs "ligand". expect_type is the PLIP interaction_type
        # string (matches the CSV filename produced by plip2csv and the `name` field written by
        # csv2cxc) that this structure is known to contain; leave it empty to skip the
        # type-presence assertions.
        include:
          - pdb: '1acj'
            label: 'pi-stacking'
            expect_type: 'pi-stacking'
            primary_chain: 'A'
            partner_chain: 'A'
            issmalmol: true
            plip_flags: ''
          - pdb: '1p5e'
            label: 'halogen bond'
            expect_type: 'halogen_bonds'
            primary_chain: 'A'
            partner_chain: 'A'
            issmalmol: true
            plip_flags: ''
          - pdb: '3og7'
            label: 'hydrogen bond'
            expect_type: 'hydrogen_bonds'
            primary_chain: 'A'
            partner_chain: 'A'
            issmalmol: true
            plip_flags: ''
          - pdb: '3ems'
            label: 'water bridge'
            expect_type: 'water_bridges'
            primary_chain: 'A'
            partner_chain: 'A'
            issmalmol: true
            plip_flags: ''
          - pdb: '1rmd'
            label: 'metal complex (zinc)'
            expect_type: 'metal_complexes'
            primary_chain: 'A'
            partner_chain: 'A'
            issmalmol: true
            plip_flags: ''
          - pdb: '2pvb'
            label: 'metal complex (calcium)'
            expect_type: 'metal_complexes'
            primary_chain: 'A'
            partner_chain: 'A'
            issmalmol: true
            plip_flags: ''
          - pdb: '6nhb'
            label: 'pi-cation'
            expect_type: 'pi-cation_interactions'
            primary_chain: 'A'
            partner_chain: 'A'
            issmalmol: true
            plip_flags: ''
          - pdb: '2reg'
            label: 'salt bridge + pi-cation'
            expect_type: 'salt_bridges'
            primary_chain: 'A'
            partner_chain: 'A'
            issmalmol: true
            plip_flags: ''
          - pdb: '3r0t'
            label: 'hydrophobic (comprehensive)'
            expect_type: 'hydrophobic_interactions'
            primary_chain: 'A'
            partner_chain: 'A'
            issmalmol: true
            plip_flags: ''
          - pdb: '1tf6'
            label: 'protein receptor, DNA ligand'
            expect_type: 'hydrogen_bonds'
            primary_chain: 'A'
            partner_chain: 'B,C'
            issmalmol: false
            plip_flags: ''
          - pdb: '4yb0'
            label: 'RNA-only receptor'
            expect_type: 'salt_bridges'
            primary_chain: 'R'
            partner_chain: 'R'
            issmalmol: true
            plip_flags: '--dnareceptor'
          - pdb: '4day'
            label: 'protein receptor, peptide ligand'
            expect_type: 'hydrogen_bonds'
            primary_chain: 'A,B'
            partner_chain: 'C'
            issmalmol: false
            plip_flags: '--peptides C'
          - pdb: '2ndo'
            label: 'NMR ensemble'
            expect_type: ''
            primary_chain: 'A'
            partner_chain: 'A'
            issmalmol: true
            plip_flags: ''
          - pdb: '9kbz'
            label: 'RNA receptor, protein ligand (explicit --chains)'
            expect_type: ''
            primary_chain: 'C,D'
            partner_chain: 'A,B'
            issmalmol: false
            plip_flags: '--dnareceptor --chains "[[''C'',''D''], [''A'',''B'']]"'
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: install package
      run: |
        python -m pip install --progress-bar=off -U pip
        python -m pip install --progress-bar=off .
    - name: "generate PLIP report (${{ matrix.pdb }})"
      run: |
        mkdir -p "integration-data/raw/${{ matrix.pdb }}"
        docker run --rm \
          -v "${GITHUB_WORKSPACE}/integration-data/raw/${{ matrix.pdb }}:/results" \
          -w /results \
          --user "$(id -u):$(id -g)" \
          pharmai/plip:latest -i ${{ matrix.pdb }} -t ${{ matrix.plip_flags }}
    - name: convert PLIP report to csv
      run: |
        mkdir -p "integration-data/csv/${{ matrix.pdb }}"
        REPORT_PATH="$(find "integration-data/raw/${{ matrix.pdb }}" -type f -name '*.txt' | head -n 1)"
        if [ -z "$REPORT_PATH" ]; then
          echo "No .txt PLIP report found for ${{ matrix.pdb }}"
          find "integration-data/raw/${{ matrix.pdb }}" -maxdepth 3 -type f || true
          exit 1
        fi
        pliparser plip2csv --input "$REPORT_PATH" --output "integration-data/csv/${{ matrix.pdb }}"
    - name: verify csv output
      run: |
        CSV_COUNT="$(find "integration-data/csv/${{ matrix.pdb }}" -type f -name '*.csv' | wc -l | tr -d ' ')"
        echo "Generated CSV files: $CSV_COUNT"
        if [ "$CSV_COUNT" -eq 0 ]; then
          echo "No CSV files were generated"
          exit 1
        fi
        EXPECT_TYPE="${{ matrix.expect_type }}"
        if [ -n "$EXPECT_TYPE" ] && [ ! -f "integration-data/csv/${{ matrix.pdb }}/${EXPECT_TYPE}.csv" ]; then
          echo "Expected interaction type '$EXPECT_TYPE' not found for ${{ matrix.pdb }}"
          find "integration-data/csv/${{ matrix.pdb }}" -maxdepth 1 -type f
          exit 1
        fi
    - name: "csv2cxc via JSON config"
      run: |
        mkdir -p integration-data/cxc
        PARTNER_COLOR="green"
        if [ "${{ matrix.issmalmol }}" = "false" ]; then
          PARTNER_COLOR="cornflowerblue"
        fi
        cat > "integration-data/cxc/csv2cxc-config-${{ matrix.pdb }}.json" <<JSON
        {
          "pdb": "${{ matrix.pdb }}",
          "model_id": 1,
          "chains": [
            {"chain": "${{ matrix.primary_chain }}", "color": "gray", "transparency": 65},
            {"chain": "${{ matrix.partner_chain }}", "color": "$PARTNER_COLOR", "small_molecule": ${{ matrix.issmalmol }}}
          ],
          "sources": [
            {"name": "main", "input": "${GITHUB_WORKSPACE}/integration-data/csv/${{ matrix.pdb }}", "issmalmol": ${{ matrix.issmalmol }}}
          ]
        }
        JSON
        pliparser csv2cxc \
          --output "integration-data/cxc/${{ matrix.pdb }}.cxc" \
          --config "integration-data/cxc/csv2cxc-config-${{ matrix.pdb }}.json"
    - name: "csv2cxc via explicit CLI flags (no --config)"
      run: |
        PARTNER_COLOR="green"
        SMALMOL_FLAG="--partner-small-molecule"
        if [ "${{ matrix.issmalmol }}" = "false" ]; then
          PARTNER_COLOR="cornflowerblue"
          SMALMOL_FLAG="--no-partner-small-molecule"
        fi
        pliparser csv2cxc \
          --input "integration-data/csv/${{ matrix.pdb }}" \
          --output "integration-data/cxc/${{ matrix.pdb }}-cliargs.cxc" \
          --pdb "${{ matrix.pdb }}" \
          --model-id 1 \
          --primary-chain "${{ matrix.primary_chain }}" \
          --primary-color gray \
          --primary-transparency 65 \
          --partner-chain "${{ matrix.partner_chain }}" \
          --partner-color "$PARTNER_COLOR" \
          $SMALMOL_FLAG
    - name: "csv2cxc with --label-residues"
      run: |
        pliparser csv2cxc \
          --output "integration-data/cxc/${{ matrix.pdb }}-labeled.cxc" \
          --config "integration-data/cxc/csv2cxc-config-${{ matrix.pdb }}.json" \
          --label-residues
    - name: "csv2cxc with --interaction-types filter (exclude expected type)"
      if: matrix.expect_type != ''
      run: |
        ALL_TYPES=(hydrophobic_interactions hydrogen_bonds water_bridges salt_bridges pi-stacking pi-cation_interactions halogen_bonds metal_complexes)
        KEEP_TYPES=()
        for t in "${ALL_TYPES[@]}"; do
          if [ "$t" != "${{ matrix.expect_type }}" ]; then
            KEEP_TYPES+=("$t")
          fi
        done
        pliparser csv2cxc \
          --output "integration-data/cxc/${{ matrix.pdb }}-filtered.cxc" \
          --config "integration-data/cxc/csv2cxc-config-${{ matrix.pdb }}.json" \
          --interaction-types "${KEEP_TYPES[@]}"
    - name: verify cxc outputs
      run: |
        for CXC_PATH in \
          "integration-data/cxc/${{ matrix.pdb }}.cxc" \
          "integration-data/cxc/${{ matrix.pdb }}-cliargs.cxc" \
          "integration-data/cxc/${{ matrix.pdb }}-labeled.cxc"; do
          if [ ! -s "$CXC_PATH" ]; then
            echo "CXC file was not generated or is empty: $CXC_PATH"
            exit 1
          fi
          grep -q "# ChimeraX Command File" "$CXC_PATH" || {
            echo "CXC output does not contain expected header: $CXC_PATH"
            exit 1
          }
        done
        EXPECT_TYPE="${{ matrix.expect_type }}"
        if [ -n "$EXPECT_TYPE" ]; then
          grep -q "name ${EXPECT_TYPE}" "integration-data/cxc/${{ matrix.pdb }}.cxc" || {
            echo "Expected interaction type '$EXPECT_TYPE' not found in cxc for ${{ matrix.pdb }}"
            exit 1
          }
          grep -q 'label #' "integration-data/cxc/${{ matrix.pdb }}-labeled.cxc" || {
            echo "--label-residues did not produce label commands for ${{ matrix.pdb }}"
            exit 1
          }
          FILTERED_CXC="integration-data/cxc/${{ matrix.pdb }}-filtered.cxc"
          if grep -q "name ${EXPECT_TYPE}" "$FILTERED_CXC"; then
            echo "Filtered cxc for ${{ matrix.pdb }} still contains excluded type '$EXPECT_TYPE'"
            exit 1
          fi
        fi
    - name: upload integration artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-${{ matrix.pdb }}-data
        path: |
          integration-data/raw/${{ matrix.pdb }}
          integration-data/csv/${{ matrix.pdb }}
          integration-data/cxc

  integration-multi-source-9kbz:
    # Demonstrates aggregating two independent PLIP runs on the same structure (PDB 9KBZ,
    # a DCL4-DRB4-dsRNA complex: chain A = DCL4, chain B = DRB4, chains C/D = RNA) into one
    # .cxc, each chain getting its own explicit color instead of being forced into a single
    # receptor/ligand pair. Needs two separate `docker run ... plip` invocations with
    # different --chains groupings feeding one aggregated JSON config, so it doesn't fit the
    # per-matrix-entry step template above and runs as its own job instead.
    name: "integration (9kbz multi-source: DCL4-RNA + DCL4-DRB4)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: install package
      run: |
        python -m pip install --progress-bar=off -U pip
        python -m pip install --progress-bar=off .
    - name: "generate PLIP report (DCL4 vs RNA, --dnareceptor)"
      run: |
        mkdir -p integration-data/raw/9kbz-dcl4-rna
        docker run --rm \
          -v "${GITHUB_WORKSPACE}/integration-data/raw/9kbz-dcl4-rna:/results" \
          -w /results \
          --user "$(id -u):$(id -g)" \
          pharmai/plip:latest -i 9kbz -t --dnareceptor --chains "[['C','D'], ['A']]"
    - name: "generate PLIP report (DCL4 vs DRB4, protein-protein)"
      run: |
        mkdir -p integration-data/raw/9kbz-dcl4-drb4
        docker run --rm \
          -v "${GITHUB_WORKSPACE}/integration-data/raw/9kbz-dcl4-drb4:/results" \
          -w /results \
          --user "$(id -u):$(id -g)" \
          pharmai/plip:latest -i 9kbz -t --chains "[['A'], ['B']]"
    - name: convert both PLIP reports to csv
      run: |
        for RUN in 9kbz-dcl4-rna 9kbz-dcl4-drb4; do
          mkdir -p "integration-data/csv/${RUN}"
          REPORT_PATH="$(find "integration-data/raw/${RUN}" -type f -name '*.txt' | head -n 1)"
          if [ -z "$REPORT_PATH" ]; then
            echo "No .txt PLIP report found for ${RUN}"
            find "integration-data/raw/${RUN}" -maxdepth 3 -type f || true
            exit 1
          fi
          pliparser plip2csv --input "$REPORT_PATH" --output "integration-data/csv/${RUN}"
        done
    - name: "csv2cxc multi-source aggregation"
      run: |
        mkdir -p integration-data/cxc
        cat > integration-data/cxc/csv2cxc-config-9kbz-multisource.json <<JSON
        {
          "pdb": "9kbz",
          "model_id": 1,
          "chains": [
            {"chain": "A",   "color": "gray",          "transparency": 0},
            {"chain": "B",   "color": "orange",         "transparency": 0},
            {"chain": "C,D", "color": "cornflowerblue", "transparency": 65}
          ],
          "sources": [
            {"name": "dcl4_rna",  "input": "${GITHUB_WORKSPACE}/integration-data/csv/9kbz-dcl4-rna",  "issmalmol": false},
            {"name": "dcl4_drb4", "input": "${GITHUB_WORKSPACE}/integration-data/csv/9kbz-dcl4-drb4", "issmalmol": false, "label_residues": true}
          ]
        }
        JSON
        pliparser csv2cxc \
          --output integration-data/cxc/9kbz-multisource.cxc \
          --config integration-data/cxc/csv2cxc-config-9kbz-multisource.json
    - name: verify multi-source output
      run: |
        test -s integration-data/cxc/9kbz-multisource.cxc
        grep -q "# ChimeraX Command File" integration-data/cxc/9kbz-multisource.cxc
        grep -q "color #1/A gray" integration-data/cxc/9kbz-multisource.cxc
        grep -q "color #1/B orange" integration-data/cxc/9kbz-multisource.cxc
        grep -q "color #1/C,D cornflowerblue" integration-data/cxc/9kbz-multisource.cxc
        grep -q "^rename #.* dcl4_rna_" integration-data/cxc/9kbz-multisource.cxc
        grep -q "^rename #.* dcl4_drb4_" integration-data/cxc/9kbz-multisource.cxc
        grep -q 'label #' integration-data/cxc/9kbz-multisource.cxc
    - name: upload integration artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-9kbz-multisource-data
        path: |
          integration-data/raw/9kbz-dcl4-rna
          integration-data/raw/9kbz-dcl4-drb4
          integration-data/csv/9kbz-dcl4-rna
          integration-data/csv/9kbz-dcl4-drb4
          integration-data/cxc
