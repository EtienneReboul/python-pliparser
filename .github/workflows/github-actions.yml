name: build
on:
  push:
    paths:
      - src/**
      - tests/**
      - ci/**
      - .github/workflows/**
      - pyproject.toml
      - tox.ini
      - pytest.ini
      - .pre-commit-config.yaml
      - .taplo.toml
  pull_request:
    paths:
      - src/**
      - tests/**
      - ci/**
      - .github/workflows/**
      - pyproject.toml
      - tox.ini
      - pytest.ini
      - .pre-commit-config.yaml
      - .taplo.toml
  workflow_dispatch:
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
